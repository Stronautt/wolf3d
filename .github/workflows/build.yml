name: build

on: [push, pull_request]

env:
  VERSION: "1.1"

jobs:
  linux:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: >-
          dnf install -y gcc make pkgconf-pkg-config tar gzip
          SDL3-devel SDL3_image-devel SDL3_ttf-devel SDL3_mixer-devel
      - uses: actions/checkout@v7
      - run: make
      - run: |
          d=wolf3d-$VERSION-linux-x86_64
          mkdir $d && cp -r wolf3d resources $d && tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v7
        with:
          path: wolf3d-*.tar.gz
          archive: false

  macos:
    runs-on: macos-latest
    steps:
      - run: brew install pkgconf sdl3 sdl3_image sdl3_ttf sdl3_mixer
      - uses: actions/checkout@v7
      - run: make
      - run: |
          d=wolf3d-$VERSION-macos-arm64
          mkdir $d && cp -r wolf3d resources $d && tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v7
        with:
          path: wolf3d-*.tar.gz
          archive: false

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-image
            mingw-w64-ucrt-x86_64-sdl3-ttf
            mingw-w64-ucrt-x86_64-sdl3-mixer
      - uses: actions/checkout@v7
      - run: make
      - run: ldd wolf3d.exe | grep -o '/ucrt64/[^ ]*' | xargs cp -t .
      - uses: actions/upload-artifact@v7
        with:
          name: wolf3d-${{ env.VERSION }}-windows-x86_64
          path: |
            wolf3d.exe
            *.dll
            resources
